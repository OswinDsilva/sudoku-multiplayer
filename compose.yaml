services:
  proxy:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - 80:80

  backend:
    build:
      context: .
      dockerfile: src/sudoku/Dockerfile
    image: sudoku-backend
    ports:
      - 8000:8000
  frontend:
    image: nginx:alpine
    volumes:
      - ./frontend:/usr/share/nginx/html
    ports:
      - 5000:80
